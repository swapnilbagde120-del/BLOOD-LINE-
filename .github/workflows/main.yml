name: Build BloodLine APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          mkdir -p project
          unzip -o BloodLine-World-Class.zip -d project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK with Logs
        run: |
          cd project
          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            TARGET_DIR=$(find . -maxdepth 2 -name "build.gradle*" -o -name "settings.gradle*" | head -n 1 | xargs dirname)
            cd "$TARGET_DIR"
          fi
          
          printf '%s\n' \
            'android.useAndroidX=true' \
            'android.enableJetifier=true' \
            'org.gradle.jvmargs=-Xmx3072m' \
            >> gradle.properties

          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace --info --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BloodLine-debug-apk
          path: "**/*.apk"
          if-no-files-found: warn
