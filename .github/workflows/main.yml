name: Build BloodLine APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          mkdir -p project
          unzip -o BloodLine-World-Class.zip -d project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: |
          # settings.gradle असलेली मुख्य डिरेक्टरी शोधणे
          ROOT_DIR=$(find project -name "settings.gradle*" | head -n 1 | xargs dirname)
          echo "Root project found in: $ROOT_DIR"
          cd "$ROOT_DIR"

          printf '%s\n' \
            'android.useAndroidX=true' \
            'android.enableJetifier=true' \
            'org.gradle.jvmargs=-Xmx3072m' \
            'android.nonTransitiveRClass=false' \
            >> gradle.properties

          # Root लेव्हलवरून बिल्ड करणे
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BloodLine-debug-apk
          path: "project/**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
