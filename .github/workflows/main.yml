name: Build BloodLine APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          mkdir -p project
          unzip -o BloodLine-World-Class.zip -d project

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure and Generate Wrapper
        run: |
          cd project
          BUILD_FILE=$(find . -name "build.gradle*" | head -n 1)
          if [ -n "$BUILD_FILE" ]; then
            cd $(dirname "$BUILD_FILE")
          fi
          
          printf '%s\n' \
            'android.useAndroidX=true' \
            'android.enableJetifier=true' \
            'org.gradle.jvmargs=-Xmx3072m' \
            >> gradle.properties

          gradle wrapper

      - name: Build Debug APK
        run: |
          cd project
          BUILD_FILE=$(find . -name "build.gradle*" | head -n 1)
          if [ -n "$BUILD_FILE" ]; then
            cd $(dirname "$BUILD_FILE")
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BloodLine-debug-apk
          path: "project/**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
